<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline &middot; VeriVault</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 2rem;
    }
    .panel { max-width: 22rem; }
    .mark {
        width: 46px; height: 46px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 2rem;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #4f46e5; box-shadow: 0 0 12px #4f46e5; }
    h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
    p { color: #94a3b8; line-height: 1.6; font-size: 0.9rem; margin: 0 0 2rem; }
    button {
        font: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        color: #fff;
        background: #4f46e5;
        border: none;
        border-radius: 0.5rem;
        padding: 0.8rem 1.6rem;
        cursor: pointer;
        transition: background 0.25s ease;
    }
    button:hover { background: #4338ca; }
</style>
</head>
<body>
    <div class="panel">
        <div class="mark"><div class="dot"></div></div>
        <h1>No connection to the campus server</h1>
        <p>VeriVault reads attendance live from the cameras on site, so there is nothing useful to show while you are offline. Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
