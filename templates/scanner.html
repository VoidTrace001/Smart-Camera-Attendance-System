{% extends "layout.html" %}

{% block content %}
<header>
    <h1>Universal Cloud Scanner</h1>
    <p>Point the camera at a row. Everyone recognised in the frame is marked.</p>
</header>

<div class="card" style="max-width: 600px; margin: 0 auto; text-align: center;">
    <div id="scannerContainer" style="position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #000; aspect-ratio: 4/3;">
        <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
        
        <!-- Scanning Animation -->
        <div id="scanLine" style="position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--primary-color); box-shadow: 0 0 15px var(--primary-color); animation: scan 2s infinite linear;"></div>
    </div>

    <div id="resultBox">
        <div id="statusText">Ready to scan</div>
        <div id="tally"></div>
    </div>

    <div id="roll"></div>

    <div class="scan-controls">
        <button id="startBtn" class="btn" onclick="startScanner()">Start Camera</button>
        <button id="flipBtn" class="btn" onclick="flipCamera()" style="background: var(--secondary-color); color: var(--text-main); flex: 0 0 auto;" title="Switch camera">Flip</button>
        <button id="stopBtn" class="btn" style="background: var(--danger);" onclick="stopScanner()" disabled>Stop</button>
    </div>
</div>

<style>
    @keyframes scan {
        0% { top: 0; }
        100% { top: 100%; }
    }
    #scannerContainer.success { border: 4px solid var(--success); }

    #resultBox { margin-top: 2rem; padding: 1.35rem; border-radius: var(--radius-md);
                 background: var(--secondary-color); }
    #statusText { font-weight: 700; font-size: 1.05rem; }
    #tally { margin-top: 0.4rem; font-size: 0.8rem; color: var(--text-muted);
             letter-spacing: 0.02em; min-height: 1.1em; }

    #roll { margin-top: 1.25rem; text-align: left; display: flex;
            flex-direction: column; gap: 0.5rem; }
    #roll:empty { display: none; }

    .roll-row { display: flex; align-items: center; gap: 0.75rem;
                padding: 0.7rem 0.9rem; border-radius: var(--radius-md);
                border: 1px solid var(--border-color); background: var(--card-bg);
                animation: rollIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .roll-row .who { flex: 1; min-width: 0; font-weight: 700; font-size: 0.9rem;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .roll-row .conf { font-size: 0.72rem; color: var(--text-muted);
                      font-variant-numeric: tabular-nums; }

    @keyframes rollIn { from { opacity: 0; transform: translateY(-6px); } }

    .scan-controls { margin-top: 2rem; display: flex; gap: 0.75rem; }
    .scan-controls .btn { flex: 1; }

    @media (max-width: 480px) {
        .scan-controls { flex-wrap: wrap; }
        .scan-controls .btn { flex: 1 1 100%; }
        .scan-controls #flipBtn { flex: 1 1 100%; order: 3; }
    }
</style>

<script>
const video = document.getElementById('webcam');
const canvas = document.createElement('canvas');
const statusText = document.getElementById('statusText');
const tally = document.getElementById('tally');
const roll = document.getElementById('roll');

let scanning = false;
let timer = null;
let facing = 'environment';       // the back camera - you cannot scan a row with a selfie lens
const seen = new Map();

async function startScanner() {
    if (!window.isSecureContext && window.location.hostname !== 'localhost') {
        Swal.fire({
            icon: 'error',
            title: 'Security Restriction',
            text: 'Camera access is blocked by your browser because this site is not running over a secure connection (HTTPS). Please use http://localhost:5000 or configure an SSL certificate.',
            confirmButtonColor: 'var(--primary-color)'
        });
        return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        Swal.fire({
            icon: 'warning',
            title: 'Browser Incompatible',
            text: 'Your browser does not support camera access or has blocked it. Try using Chrome or Firefox on localhost.',
        });
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facing, width: { ideal: 1280 } },
            audio: false
        });
        video.srcObject = stream;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;

        scanning = true;
        statusText.innerText = 'Scanning for faces';
        scanLoop();
    } catch (err) {
        Swal.fire({ icon: 'error', title: 'Camera unavailable', text: String(err) });
    }
}

function stopScanner() {
    scanning = false;
    clearTimeout(timer);

    const stream = video.srcObject;
    if (stream) stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;

    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    statusText.innerText = seen.size ? `Stopped - ${seen.size} marked this session` : 'Scanner stopped';
}

async function flipCamera() {
    facing = facing === 'environment' ? 'user' : 'environment';
    if (!video.srcObject) return;
    const wasScanning = scanning;
    stopScanner();
    if (wasScanning) await startScanner();
}

// One scan at a time. A row of ten faces takes longer than the old fixed 2s
// interval, and the requests were stacking up on top of each other.
function scanLoop() {
    if (!scanning) return;
    timer = setTimeout(async () => {
        await captureAndScan();
        scanLoop();
    }, 1500);
}

function addToRoll(person, state) {
    const key = `${person.role}:${person.name}`;
    if (seen.has(key)) return false;
    seen.set(key, state);

    const row = document.createElement('div');
    row.className = 'roll-row';
    row.innerHTML = `
        <span class="badge ${state === 'marked' ? 'badge-success' : 'badge-primary'}">
            ${state === 'marked' ? 'Present' : 'Already in'}
        </span>
        <span class="who"></span>
        <span class="conf">${person.confidence}%</span>`;
    row.querySelector('.who').textContent = `${person.name} (${person.role})`;
    roll.prepend(row);
    return true;
}

async function captureAndScan() {
    if (!video.srcObject || !video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    try {
        const response = await fetch('/api/cloud_scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: canvas.toDataURL('image/jpeg', 0.7) })
        });
        const result = await response.json();
        if (result.error) {
            statusText.innerText = result.error;
            return;
        }

        let fresh = 0;
        (result.marked || []).forEach(p => { if (addToRoll(p, 'marked')) fresh++; });
        (result.already || []).forEach(p => addToRoll(p, 'already'));

        statusText.innerText = result.status;

        const parts = [`${result.faces} face${result.faces === 1 ? '' : 's'} in frame`];
        if (result.unknown) parts.push(`${result.unknown} not recognised`);
        if (result.faces > result.processed) parts.push(`${result.processed} closest processed`);
        if (seen.size) parts.push(`${seen.size} on the roll`);
        tally.innerText = parts.join(' · ');

        if (fresh) {
            const box = document.getElementById('scannerContainer');
            box.classList.add('success');
            setTimeout(() => box.classList.remove('success'), 1200);
        }
    } catch (err) {
        console.error('Scan error:', err);
        statusText.innerText = 'Lost contact with the server';
    }
}
</script>
{% endblock %}
